
name: Publicar documentación MkDocs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar Material
        run: pip install mkdocs-material

      - name: Publicar
        run: |
          cd Practica4-pages/practica4
          mkdocs gh-deploy --force
